<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · TikTok Comment Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth">
    <div class="auth-shell">
      <div class="auth-card">
        <a class="brand" href="/">
          <span class="brand-dot"></span>
          <span>TikTok Comment Manager</span>
        </a>
        <h1>Create your account</h1>
        <p class="lead">
          Free, self-hosted, and yours. Sign up to start connecting your
          TikTok accounts.
        </p>

        <div id="flash" class="auth-error" hidden></div>

        <form id="signup-form" class="auth-form" autocomplete="on" novalidate>
          <div class="field">
            <label for="displayName">Display name (optional)</label>
            <input
              id="displayName"
              name="displayName"
              type="text"
              autocomplete="name"
              placeholder="Your name"
              maxlength="80"
            />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="256"
              placeholder="At least 8 characters"
            />
          </div>
          <button class="btn primary" type="submit" id="submit-btn">
            Create account
          </button>
        </form>

        <p class="auth-meta">
          Already have an account? <a href="/login">Log in</a>
        </p>
        <p class="auth-meta">
          <a href="/">Back to home</a>
        </p>
      </div>
    </div>

    <script>
      (function () {
        var form = document.getElementById('signup-form');
        var flash = document.getElementById('flash');
        var btn = document.getElementById('submit-btn');

        function showError(msg) {
          flash.textContent = msg;
          flash.hidden = false;
        }
        function clearError() {
          flash.hidden = true;
          flash.textContent = '';
        }

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          clearError();
          var email = document.getElementById('email').value.trim();
          var password = document.getElementById('password').value;
          var displayName = document
            .getElementById('displayName')
            .value.trim();
          if (!email || !password) {
            showError('Please enter your email and password.');
            return;
          }
          if (password.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
          }
          btn.disabled = true;
          btn.textContent = 'Creating account…';
          try {
            var body = { email: email, password: password };
            if (displayName) body.displayName = displayName;
            var res = await fetch('/api/auth/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify(body),
            });
            var data = null;
            try {
              data = await res.json();
            } catch (err) {}
            if (!res.ok) {
              showError((data && data.error) || 'Signup failed');
              return;
            }
            window.location.href = '/app';
          } catch (err) {
            showError('Network error. Please try again.');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Create account';
          }
        });

        fetch('/api/auth/me', { credentials: 'same-origin' })
          .then(function (res) {
            if (res.ok) window.location.href = '/app';
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
